[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topcharge"
version = "1.0.0"
description = "Official Python SDK for the TopCharge merchant API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TopCharge" }]
keywords = ["topcharge", "payments", "payment-gateway", "iraq", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://topcharge.app"
Documentation = "https://topcharge.app/api-docs/"

[project.optional-dependencies]
async = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
